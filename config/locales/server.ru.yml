ru:
  site_settings:
    wb_bot_model_fallback_enabled: "Переводить ответы ИИ-бота на запасную модель, когда пользователь за последние 24 часа сделал больше заданного числа обращений к модели. Пока запасная модель не выбрана, плагин ничего не меняет."
    wb_bot_model_fallback_daily_calls: "Порог: сколько вызовов модели от имени одного пользователя за последние 24 часа (скользящее окно) обслуживает основная модель; следующие ответы этому пользователю генерирует запасная. Один ответ бота — обычно 3–4 вызова: поиск по базе знаний и сам ответ. Считаются ответы в личных диалогах с ботом и ответы автоматизаций; заголовки тем, суммаризация и прочие функции не считаются."
    wb_bot_model_fallback_llm: "Запасная, более дешёвая модель для ответов сверх порога. Пусто — плагин ничего не меняет. Если у бота основная модель совпадает с запасной, переключать нечего."
