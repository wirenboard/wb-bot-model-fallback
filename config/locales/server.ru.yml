ru:
  site_settings:
    wb_bot_model_fallback_notice_switch: "Сообщение в начале первого ответа облегчённой версии. Подстановки: %{questions} — порог со словом «вопросов» в нужном падеже, %{answers} — только число, %{until} — конец срока по Москве. Пусто — не показывать. Модели не называть."
    wb_bot_model_fallback_reminder_every: "Каждый N-й ответ облегчённой версии начинается с напоминания, что отвечает облегчённая версия и когда вернётся основная. Считается от ответа с сообщением о переходе: при 20 напоминания придут в 21-м, 41-м и следующих ответах срока. 0 — не напоминать."
    wb_bot_model_fallback_notice_reminder: "Текст напоминания. Подстановки те же, что в сообщении о переходе: %{until} — конец срока по Москве, %{questions}, %{answers}. Пусто — не напоминать. Модели не называть."
    wb_bot_model_fallback_notice_return: "Сообщение в начале первого ответа основной версии после конца срока. Пусто — не показывать."
    wb_bot_model_fallback_enabled: "Переводить пользователя на запасную модель ИИ-бота, когда он получил заданное число ответов основной моделью за сутки. Пока запасная модель не выбрана, плагин ничего не меняет."
    wb_bot_model_fallback_daily_answers: "Сколько ответов основной моделью получает пользователь за скользящие сутки. Следующий вопрос переводит его на запасную модель. Считаются ответы бота в личных диалогах и ответы автоматизаций, а не отдельные вызовы модели; ответы запасной модели не считаются."
    wb_bot_model_fallback_hours: "На сколько часов пользователь переходит на запасную модель; это же окно, в котором считаются ответы основной моделью. Срок не продлевается, после него счёт начинается заново."
    wb_bot_model_fallback_exempt_staff: "Не ограничивать сотрудников (администраторов и модераторов)."
    wb_bot_model_fallback_llm: "Запасная, более дешёвая модель. Пусто — плагин ничего не меняет. Если у бота основная модель совпадает с запасной, переключать нечего."
  wb_bot_model_fallback:
    questions:
      one: "%{count} вопрос"
      few: "%{count} вопроса"
      many: "%{count} вопросов"
      other: "%{count} вопроса"
