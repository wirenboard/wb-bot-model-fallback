ru:
  site_settings:
    wb_bot_model_fallback_enabled: "Переводить пользователя на запасную модель ИИ-бота, когда он получил заданное число ответов основной моделью за сутки. Пока запасная модель не выбрана, плагин ничего не меняет."
    wb_bot_model_fallback_daily_answers: "Сколько ответов основной моделью получает пользователь за скользящие сутки. Следующий вопрос переводит его на запасную модель. Считаются ответы бота в личных диалогах и ответы автоматизаций, а не отдельные вызовы модели; ответы запасной модели не считаются."
    wb_bot_model_fallback_hours: "На сколько часов пользователь переходит на запасную модель; это же окно, в котором считаются ответы основной моделью. Срок не продлевается, после него счёт начинается заново."
    wb_bot_model_fallback_exempt_staff: "Не ограничивать сотрудников (администраторов и модераторов)."
    wb_bot_model_fallback_llm: "Запасная, более дешёвая модель. Пусто — плагин ничего не меняет. Если у бота основная модель совпадает с запасной, переключать нечего."
