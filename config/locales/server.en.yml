en:
  site_settings:
    wb_bot_model_fallback_enabled: "Switch AI bot replies to a fallback model once a user has made more than the configured number of model calls in the last 24 hours. Does nothing until a fallback model is selected."
    wb_bot_model_fallback_daily_calls: "Threshold: how many model calls on behalf of one user in the last 24 hours (rolling window) are served by the primary model; later replies to that user are generated by the fallback model. One bot reply is usually 3-4 calls (knowledge base search plus the answer). Counts replies in AI bot PMs and automation replies; topic titles, summaries and other features are not counted."
    wb_bot_model_fallback_llm: "Fallback, cheaper model for replies above the threshold. Empty means the plugin changes nothing. If a bot's primary model is the fallback model, there is nothing to switch."
