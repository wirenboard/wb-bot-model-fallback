plugins:
  wb_bot_model_fallback_enabled:
    default: false
    client: false
  wb_bot_model_fallback_daily_answers:
    default: 20
    min: 1
    max: 10000
    client: false
  wb_bot_model_fallback_hours:
    default: 24
    min: 1
    max: 168
    client: false
  wb_bot_model_fallback_exempt_staff:
    default: true
    client: false
  wb_bot_model_fallback_notice_switch:
    default: "Вы задали помощнику %{questions} за сутки. До %{until} (МСК) на вопросы отвечает облегчённая версия помощника, потом снова основная."
    textarea: true
    client: false
  wb_bot_model_fallback_notice_return:
    default: "Снова отвечает основная версия помощника."
    textarea: true
    client: false
  wb_bot_model_fallback_llm:
    default: ""
    type: enum
    enum: "DiscourseAi::Configuration::LlmEnumerator"
    client: false
